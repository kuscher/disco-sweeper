# Builds Disco Sweeper, runs the headless model checks, and plays it in the x86_64 Android
# emulator through the debug build's test hooks (tools/smoke.sh).
#
# Disco Sweeper is developed on an Arm laptop, and many Android laptops have Intel chips. The APK
# is pure Java with no native code, so it's the same file on both, and this checks it on an
# x86_64 device. No keys here: release APKs are signed on the maintainer's machine
# (tools/release.sh), so this workflow only ever builds debug and unsigned release APKs.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and model checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Build the debug and (unsigned) release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Board fit, solver and save/restore checks
        run: ./ds sim

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk

  emulator:
    name: Play it in an x86_64 emulator (Android 16)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Android 16's plain AOSP image on a tablet profile. The Android 17 images restart
      # SurfaceFlinger under software rendering on these runners.
      IMAGE: system-images;android-36;default;x86_64
      ANDROID_SERIAL: emulator-5554
      ADB_SERVER_SOCKET: tcp:localhost:5037
      DS_WINDOWING_MODE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/share/swift
          df -h / | tail -1

      - name: Start the emulator
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin
          EMU=$ANDROID_HOME/emulator/emulator
          yes | "$SDKM/sdkmanager" --licenses > /dev/null || true
          "$SDKM/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null
          # A generic tablet-sized profile when the SDK has one, else the default.
          DEVICE=$("$SDKM/avdmanager" list device -c | grep -x medium_tablet || true)
          echo no | "$SDKM/avdmanager" create avd -n tablet -k "$IMAGE" ${DEVICE:+-d "$DEVICE"}
          adb start-server
          "$EMU" -avd tablet -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -memory 4096 > emulator.log 2>&1 &
          timeout 300 adb wait-for-device || { tail -40 emulator.log; exit 1; }
          timeout 900 bash -c 'until [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") == 1 ]]; do sleep 5; done' ||
            { tail -40 emulator.log; exit 1; }
          timeout 300 bash -c 'until adb shell pm path android >/dev/null 2>&1; do sleep 5; done'
          adb shell getprop ro.product.cpu.abilist
          # Keep the screen on and unlocked for the run.
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          sleep 20

      - name: Install
        run: |
          for try in 1 2 3; do ./ds install apks/debug/app-debug.apk && break; [[ $try == 3 ]] && exit 1; sleep 20; done

      - name: Smoke test
        run: |
          # A slow emulator can leave a "System UI isn't responding" dialog up; clear it first.
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true
          adb shell dumpsys window | grep -m2 -E "mCurrentFocus|mFocusedApp" || true
          tools/smoke.sh smoke

      - name: The minified release build starts and survives a restart
        # R8 only runs on release builds, so check that one too, signed with a throwaway key
        # (the real key never leaves the maintainer's machine).
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore ci.jks -storepass cipass -keypass cipass -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=ci > /dev/null
          "$BT/apksigner" sign --ks ci.jks --ks-pass pass:cipass --out release.apk apks/release/*.apk
          adb uninstall io.github.kuscher.discosweeper || true
          ./ds install release.apk
          for run in 1 2; do
            ./ds launch; sleep 8
            adb shell dumpsys activity activities | grep -q "topResumedActivity=.*io.github.kuscher.discosweeper" ||
              { echo "the release build isn't in front after launch $run"; ./ds logs 60; exit 1; }
            ./ds stop; sleep 2
          done
          if [[ -n $(./ds crashes) ]]; then ./ds crashes; exit 1; fi
          echo "release build ok"

      - name: Logs
        if: always()
        run: |
          # This app's log lines only.
          timeout 30 ./ds logs 2000 > smoke/app-log.txt || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke
          path: smoke
